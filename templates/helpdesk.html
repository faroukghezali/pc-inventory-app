<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <title>Demande d’assistance</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/helpdesk-public.css') }}">
</head>
<body>
  <main class="helpdesk-shell">
    {% if submitted %}
    <section class="helpdesk-card helpdesk-confirmation" role="status" aria-live="polite">
      <span class="confirmation-mark" aria-hidden="true">✓</span>
      <h1>Demande envoyée</h1>
      <p>Votre demande a été envoyée avec succès !</p>
    </section>
    {% else %}
    <section class="helpdesk-card" id="helpdeskFormPanel">
      <h1>Helpdesk Request</h1>
      {% if error %}<p class="helpdesk-error" role="alert" id="helpdeskError">{{ error }}</p>{% else %}<p class="helpdesk-error" role="alert" id="helpdeskError" hidden></p>{% endif %}
      <form id="helpdeskForm" method="post" action="{{ url_for('helpdesk.submit_request') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="code_user">Code User</label>
        <input class="code-user-input" id="code_user" name="code_user" value="{{ code_user }}" maxlength="80" autocomplete="username" placeholder="Saisissez votre Code User" required>

        <label for="description">Décrivez votre problème</label>
        <textarea id="description" name="description" maxlength="5000" rows="6" placeholder="Décrivez votre problème" required>{{ description }}</textarea>

        <button class="submit-button" type="submit">Envoyer la demande</button>
      </form>
    </section>
    <section class="helpdesk-card helpdesk-scanner" id="helpdeskScanner" aria-live="polite" hidden>
      <div class="robot-stage" aria-hidden="true">
        <span class="robot-orbit orbit-one"></span><span class="robot-orbit orbit-two"></span>
        <div class="scan-line"></div>
        <div class="scan-robot">
          <span class="robot-antenna"></span>
          <span class="robot-head"><i></i><i></i><b></b></span>
          <span class="robot-neck"></span>
          <span class="robot-body"><i></i><i></i><i></i></span>
        </div>
      </div>
      <h1 id="scannerTitle">Analyse de votre demande</h1>
      <p class="scanner-status" id="scannerStatus">Transmission sécurisée en cours…</p>
      <div class="progress-track" id="progressTrack" role="progressbar" aria-label="Progression de l’envoi" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span id="progressBar"></span>
      </div>
      <strong class="progress-value" id="progressValue">0%</strong>
      <p class="scanner-success" id="scannerSuccess" role="status" hidden>Votre demande a été envoyée avec succès !</p>
      <p class="helpdesk-error scanner-error" id="scannerError" role="alert" hidden></p>
    </section>
    {% endif %}
  </main>
  <script src="{{ url_for('static', filename='js/helpdesk-submit.js') }}" defer></script>
</body>
</html>
